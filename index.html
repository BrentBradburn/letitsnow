<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <title>Let it snow</title>
    <link rel="icon" href="icon.png">
    <link rel="stylesheet" href="style.css">
    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
    <script type="text/javascript" src="https://code.jquery.com/jquery-2.1.4.min.js"></script>
</head>

<body>

    <div class="wrapper" style="border: 4px solid blue;">
        <canvas id="theCanvas" style="border: 0px solid red;"></canvas>
        <canvas id="dotCanvas" style="border: 4px solid green;"></canvas>
        <div class="cover left"></div>
        <div class="cover right"></div>
    </div>

    <div class="btns">
        <div class="preview">
            <p>PREVIEW</p>
            <p>EDIT</p>
        </div>
        <div class="start">
            <p>Let it snow</p>
            <p>Stop</p>
        </div>
    </div>

    <a-scene vr-mode-ui="enabled: true" fog="type: linear; color: #222;near:1;far:100">

        <a-assets>
            <a-asset-item id="snowflake" src="plate_mirror.obj"></a-asset-item>
            <img id="snowflakeTexture" src="icon.png">
        </a-assets>

        <a-sky color="#000"></a-sky>
        <a-light type="ambient" color="#444"></a-light>
        <a-light type="point" color="#eee" position="0 0 0"></a-light>

        <a-entity class="container" position="0 0 0" rotation="0 0 0">

            <a-entity static-body class="previewSnowflake" obj-model="obj: #snowflake;" scale=".2 .2 .2" position="0 0.3 -5" rotation="45 0 0" material="src:#snowflakeTexture;color:white;transparent:true;side:double"
                animation="property: rotation; to: 45 360 0; dur: 10000; easing: linear; loop: true">
            </a-entity>

            <a-entity id="myCam" camera position="0 0 0" rotation="0 0 0"></a-entity>

        </a-entity>

    </a-scene>

    <script src="app.js"></script>

</body>
</html>
