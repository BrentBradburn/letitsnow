<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <title>Let it snow</title>
    <link rel="icon" href="icon.png">
    <link rel="stylesheet" href="style.css">
    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/oscarmarinmiro/aframe-stereo-component@master/dist/aframe-stereo-component.min.js"></script>
    <script type="text/javascript" src="https://code.jquery.com/jquery-2.1.4.min.js"></script>
</head>

<body>

    <div class="wrapper" style="border: 4px solid blue;">
        <canvas id="theCanvas" style="border: 0px solid red;"></canvas>
        <canvas id="dotCanvas" style="border: 4px solid green;"></canvas>
        <div class="cover left"></div>
        <div class="cover right"></div>
    </div>

    <div class="btns">
        <div class="preview">
            <p>PREVIEW</p>
            <p>EDIT</p>
        </div>
        <div class="start">
            <p>Let it snow</p>
            <p>Stop</p>
        </div>
    </div>

    <a-scene
        xr-mode-ui="enabled: true; XRMode: xr;"
        fog="type: linear; color: #000;near:1;far:100"
    >

        <a-assets>
            <a-asset-item id="snowflake" src="plate_mirror.obj"></a-asset-item>
            <img id="snowflakeTexture" src="icon.png">
            <img id="leftEyeTexture" src="left-eye-texture.png">
            <img id="rightEyeTexture" src="right-eye-texture.png">
        </a-assets>

        <!--<a-sky color="#000"></a-sky>-->
        <a-light type="ambient" color="#444"></a-light>
        <a-light type="point" color="#eee" position="0 0 0"></a-light>

        <a-entity class="container" position="0 0 0" rotation="0 0 0">

            <a-entity static-body class="previewSnowflake" obj-model="obj: #snowflake;" scale=".2 .2 .2" position="0 0.3 -5" rotation="45 0 0" material="src:#snowflakeTexture;color:white;transparent:true;side:double"
                animation="property: rotation; to: 45 360 0; dur: 10000; easing: linear; loop: true">
            </a-entity>

            <a-camera id="myCam" position="0 1.0 0" rotation="0 0 0" stereocam="eye:right"></a-camera>

            <!-- panel with stereoscopic texture (different textures for each eye) -->
            <a-entity id="displayPanel" position="-0.75 1.1 -0.4" rotation="0 55 0">
                <a-plane class="leftEyePlane" position="0 0 0" material="src: #leftEyeTexture" stereo="eye: left"></a-plane>
                <a-plane class="rightEyePlane" position="0 0 0" material="src: #rightEyeTexture" stereo="eye: right"></a-plane>
            </a-entity>

            <!-- panel with stereoscopic texture (different textures for each eye) -->
            <a-entity id="mirrorPanel" position="+0 1.1 -1.4" rotation="0 0 0">
                <a-plane class="leftEyePlane" position="0 0 0" material="src: #leftEyeTexture" stereo="eye: left"></a-plane>
                <a-plane class="rightEyePlane" position="0 0 0" material="src: #rightEyeTexture" stereo="eye: right"></a-plane>
            </a-entity>

        </a-entity>

    </a-scene>

    <script>
    function generatePanelFrame(panelId,xaspect,yaspect,size) {

        const [bezelThickness,bezelDepth,panelDepth] = [0.02,0.005,0.02] // tuning parameters (in meters)

        const metersPerInch = 0.0254
        const scale = (size*metersPerInch)/Math.sqrt(xaspect*xaspect+yaspect*yaspect)
        const [panelWidth, panelHeight] = [xaspect*scale, yaspect*scale]
        const backCoverThickness = Math.min(bezelDepth,(panelDepth-bezelDepth)/2) // kind of arbitrary (but should be less than panelDepth-bezelDepth so that it doesn't overlap the display)

        // apply the computed dimensions to the panel's view planes
        const panel = document.getElementById(panelId);
        const [leftEyePlane, rightEyePlane] = [panel.querySelector('.leftEyePlane'),panel.querySelector('.rightEyePlane')]
        ;[leftEyePlane, rightEyePlane].forEach(plane => { plane.setAttribute('width', panelWidth); plane.setAttribute('height', panelHeight); })

        // define bezel elements
        const [bezelX,bezelY,bezelZ] = [panelWidth/2+bezelThickness/2,panelHeight/2+bezelThickness/2,-(panelDepth/2-bezelDepth)]
        const bezels = [
            { position: `0 ${+bezelY} ${bezelZ}`, width: panelWidth + 2*bezelThickness, height: bezelThickness }, // Top
            { position: `0 ${-bezelY} ${bezelZ}`, width: panelWidth + 2*bezelThickness, height: bezelThickness }, // Bottom
            { position: `${-bezelX} 0 ${bezelZ}`, width: bezelThickness, height: panelHeight }, // Left
            { position: `${+bezelX} 0 ${bezelZ}`, width: bezelThickness, height: panelHeight } // Right
        ]

        bezels.forEach(bezel => {
            const bezelElement = document.createElement('a-box')
            Object.entries({position: bezel.position, width: bezel.width, height: bezel.height, depth: panelDepth, color: 'black' }).forEach(([key, value]) => bezelElement.setAttribute(key, value))
            panel.appendChild(bezelElement)
        })

        const backCover = document.createElement('a-box')
        Object.entries({ position: `0 0 ${-(panelDepth - bezelDepth - backCoverThickness / 2)}`, width: panelWidth, height: panelHeight, depth: backCoverThickness, color: 'green' }).forEach(([key, value]) => backCover.setAttribute(key, value))
        panel.appendChild(backCover)
    }

    generatePanelFrame("displayPanel",892,964,14)
    generatePanelFrame("mirrorPanel",1,2,60)
    </script>

    <script src="app.js"></script>

</body>
</html>
