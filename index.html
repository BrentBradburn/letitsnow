<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <title>Let it snow</title>
    <link rel="icon" href="icon.png">
    <link rel="stylesheet" href="style.css">
    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/oscarmarinmiro/aframe-stereo-component@master/dist/aframe-stereo-component.min.js"></script>
    <script type="text/javascript" src="https://code.jquery.com/jquery-2.1.4.min.js"></script>
</head>

<body>

    <div class="wrapper" style="border: 4px solid blue;">
        <canvas id="theCanvas" style="border: 0px solid red;"></canvas>
        <canvas id="dotCanvas" style="border: 4px solid green;"></canvas>
        <div class="cover left"></div>
        <div class="cover right"></div>
    </div>

    <div class="btns">
        <div class="preview">
            <p>PREVIEW</p>
            <p>EDIT</p>
        </div>
        <div class="start">
            <p>Let it snow</p>
            <p>Stop</p>
        </div>
    </div>

    <a-scene
        xr-mode-ui="enabled: true; XRMode: xr;"
        fog="type: linear; color: #000;near:1;far:100"
    >

        <a-assets>
            <a-asset-item id="snowflake" src="plate_mirror.obj"></a-asset-item>
            <img id="snowflakeTexture" src="icon.png">
            <img id="leftEyeTexture" src="left-eye-texture.png">
            <img id="rightEyeTexture" src="right-eye-texture.png">
        </a-assets>

        <!--<a-sky color="#000"></a-sky>-->
        <a-light type="ambient" color="#444"></a-light>
        <a-light type="point" color="#eee" position="0 0 0"></a-light>

        <!-- blinking/pulsing light source -->
        <a-entity position="-3 1.6 +3">
            <a-box   color="red" depth="0.05" height="0.05" width="0.05" material="emissive: #f00; emissiveIntensity: 2" animation="property: material.emissive; to: #200; dur: 1000; dir: alternate; loop: true"></a-box>
            <a-light color="red" type="point" intensity="1" position="0 0 0"                                             animation="property: intensity; to: 0;            dur: 1000; dir: alternate; loop: true"></a-light>
        </a-entity>

        <!-- blinking/pulsing light source -->
        <a-entity position="0 1.6 +3">
            <a-box   color="green" depth="0.05" height="0.05" width="0.05" material="emissive: #0f0; emissiveIntensity: 2" animation="property: material.emissive; to: #020; dur: 2000; dir: alternate; loop: true"></a-box>
            <a-light color="green" type="point" intensity="1" position="0 0 0"                                             animation="property: intensity; to: 0;            dur: 2000; dir: alternate; loop: true"></a-light>
        </a-entity>

        <!-- blinking/pulsing light source -->
        <a-entity position="+3 1.6 +3">
            <a-box   color="blue" depth="0.05" height="0.05" width="0.05" material="emissive: #00f; emissiveIntensity: 2" animation="property: material.emissive; to: #002; dur: 3000; dir: alternate; loop: true"></a-box>
            <a-light color="blue" type="point" intensity="1" position="0 0 0"                                             animation="property: intensity; to: 0;            dur: 3000; dir: alternate; loop: true"></a-light>
        </a-entity>

        <a-entity class="container" position="0 0 0" rotation="0 0 0">

            <a-entity static-body class="previewSnowflake" obj-model="obj: #snowflake;" scale=".2 .2 .2" position="0 0.3 -5" rotation="45 0 0" material="src:#snowflakeTexture;color:white;transparent:true;side:double"
                animation="property: rotation; to: 45 360 0; dur: 10000; easing: linear; loop: true">
            </a-entity>

            <!-- Camera rig with initial orientation -->
            <a-entity id="cameraRig" position="0 0 0" rotation="0 -90 0">
                <a-camera id="myCam" position="0 1.0 0" stereocam="eye:right"
                    wasd-controls="enabled: true" look-controls="enabled: true">
                </a-camera>
            </a-entity>

            <!-- panel with stereoscopic texture (different textures for each eye) -->
            <a-entity id="stereoPanel1" position="-0.75 1.1 -0.4" rotation="0 55 0">
                <a-plane material="src: #leftEyeTexture" stereo="eye: left"></a-plane>
                <a-plane material="src: #rightEyeTexture" stereo="eye: right"></a-plane>
            </a-entity>

            <!-- panel with a (limited) mirror effect -->
            <a-entity id="mirrorPanel1" position="0 1.1 -1.4" rotation="0 0 0">
                <a-plane material="envMap: #sky; metalness: 1; roughness: 0"></a-plane>
            </a-entity>

            <a-entity id="offscreenRenderTarget" position="1.25 1.1 0" rotation="0 -90 0">
                <a-plane offscreen-render></a-plane>
            </a-entity>

        </a-entity>

    </a-scene>

    <script>
    function generatePanelFrame(panelId,xaspect,yaspect,size) {

        const [bezelThickness,bezelDepth,panelDepth] = [0.02,0.005,0.02] // tuning parameters (in meters)

        const metersPerInch = 0.0254
        const scale = (size*metersPerInch)/Math.sqrt(xaspect*xaspect+yaspect*yaspect)
        const [panelWidth, panelHeight] = [xaspect*scale, yaspect*scale]
        const backCoverThickness = Math.min(bezelDepth,(panelDepth-bezelDepth)/2) // kind of arbitrary (but should be less than panelDepth-bezelDepth so that it doesn't overlap the display)

        // apply the computed dimensions to the panel's view planes
        const panel = document.getElementById(panelId);
        const planes = panel.querySelectorAll('a-plane');
        planes.forEach(plane => { plane.setAttribute('width', panelWidth); plane.setAttribute('height', panelHeight); })

        // define bezel elements
        const [bezelX,bezelY,bezelZ] = [panelWidth/2+bezelThickness/2,panelHeight/2+bezelThickness/2,-(panelDepth/2-bezelDepth)]
        const bezels = [
            { position: `0 ${+bezelY} ${bezelZ}`, width: panelWidth + 2*bezelThickness, height: bezelThickness }, // Top
            { position: `0 ${-bezelY} ${bezelZ}`, width: panelWidth + 2*bezelThickness, height: bezelThickness }, // Bottom
            { position: `${-bezelX} 0 ${bezelZ}`, width: bezelThickness, height: panelHeight }, // Left
            { position: `${+bezelX} 0 ${bezelZ}`, width: bezelThickness, height: panelHeight } // Right
        ]

        bezels.forEach(bezel => {
            const bezelElement = document.createElement('a-box')
            Object.entries({position: bezel.position, width: bezel.width, height: bezel.height, depth: panelDepth, color: 'black' }).forEach(([key, value]) => bezelElement.setAttribute(key, value))
            panel.appendChild(bezelElement)
        })

        const backCover = document.createElement('a-box')
        Object.entries({ position: `0 0 ${-(panelDepth - bezelDepth - backCoverThickness / 2)}`, width: panelWidth, height: panelHeight, depth: backCoverThickness, color: 'green' }).forEach(([key, value]) => backCover.setAttribute(key, value))
        panel.appendChild(backCover)
    }

    generatePanelFrame("stereoPanel1",892,964,14)
    generatePanelFrame("mirrorPanel1",1,2,60)
    generatePanelFrame("offscreenRenderTarget",1,1,60)
    </script>

    <script>
    AFRAME.registerComponent('offscreen-render', {

        init: function() {
            console.log('Initializing offscreen-render component');

            // Create canvas
            this.canvas = document.createElement('canvas');
            this.canvas.width = 512;
            this.canvas.height = 512;

            // Setup renderer
            this.offscreenRenderer = new THREE.WebGLRenderer({
                canvas: this.canvas,
                antialias: true
            });
            this.offscreenRenderer.setSize(512, 512);
            this.offscreenRenderer.setClearColor(0x4080c0); // background color

            // Setup scene
            this.scene = new THREE.Scene();
            
            // Setup camera
            this.camera = new THREE.PerspectiveCamera(75, 1, 0.1, 1000);
            this.camera.position.z = 3;

            // Setup scene content
            const groundGeometry = new THREE.PlaneGeometry(10, 10);
            const groundMaterial = new THREE.MeshStandardMaterial({
                color: 0x000020,
                roughness: 0.8,
                metalness: 0.2
            });
            const ground = new THREE.Mesh(groundGeometry, groundMaterial);
            ground.rotation.x = -Math.PI / 2;  // Rotate to horizontal
            ground.position.y = 0;             // At grid level
            this.scene.add(ground);

            const gridHelper = new THREE.GridHelper(10, 10);
            this.scene.add(gridHelper);

            const ambientLight = new THREE.AmbientLight(0x404040);
            this.scene.add(ambientLight);

            const directionalLight = new THREE.DirectionalLight(0xffffff, 0.5);
            directionalLight.position.set(1, 1, 1);
            this.scene.add(directionalLight);
            this.scene.add(new THREE.DirectionalLightHelper(directionalLight, /*size*/0.2));

            for ( i=0; i<3; i++ ) {
                const colors = [0x0000ff, 0x00ff00, 0xff0000];
                const light = new THREE.PointLight(colors[i], 1, 100);
                this.scene.add(new THREE.PointLightHelper(light, /*size*/0.2));
                light.position.set(Math.cos(i * Math.PI * 2/3) * 2, 4, Math.sin(i * Math.PI * 2/3) * 2);
                this.scene.add(light);
            }

            for (i = 0; i < 3; i++) {
                // Add static cube
                const cubeGeometry = new THREE.BoxGeometry(0.8, 1, 0.8);
                const cubeMaterial = new THREE.MeshStandardMaterial({ color: 0x404080, roughness: 0.5, metalness: 0.5 });
                cube1 = new THREE.Mesh(cubeGeometry, cubeMaterial);
                cube1.position.set(+0.5 + i, 0.0, +2.5 - i);
                this.scene.add(cube1);
            }

            // Add rotating cube
            const geometry = new THREE.BoxGeometry();
            const material = new THREE.MeshStandardMaterial({ color: 0x00ff00, roughness: 0.5, metalness: 0.5 });
            this.cube = new THREE.Mesh(geometry, material);
            this.cube.position.set(0, 1, 0);
            this.scene.add(this.cube);

            // Add floating spheres
            this.spheres = [];
            for (let i = 0; i < 3; i++) {
                const sphere = new THREE.Mesh(
                    new THREE.SphereGeometry(0.3, 32, 32),
                    new THREE.MeshStandardMaterial({ color: 0x0088ff, roughness: 0.5, metalness: 0.5 })
                );
                sphere.position.set(
                    Math.cos(i * Math.PI * 2/3) * 2,
                    1.5,
                    Math.sin(i * Math.PI * 2/3) * 2
                );
                this.spheres.push(sphere);
                this.scene.add(sphere);
            }

            // Add torus
            this.torus = new THREE.Mesh(
                new THREE.TorusGeometry(1, 0.2, 16, 50),
                new THREE.MeshStandardMaterial({ color: 0xff8800, roughness: 0.5, metalness: 0.5 })
            );
            this.torus.position.set(0, 2, 0);
            this.scene.add(this.torus);

            // Adjust camera
            this.camera.position.set(4, 4, 4);
            this.camera.lookAt(0, 1, 0);

            // Setup plane material with canvas texture
            const texture = new THREE.CanvasTexture(this.canvas);
            texture.needsUpdate = true;
            
            const planeMesh = this.el.getObject3D('mesh');
            planeMesh.material = new THREE.MeshBasicMaterial({
                map: texture,
                side: THREE.DoubleSide
            });
            
            this.texture = texture;
        },

        // Animate and render
        tick: function(time) {

            this.cube.rotation.x = time * 0.001;
            this.cube.rotation.y = time * 0.001;
            
            this.offscreenRenderer.render(this.scene, this.camera);
            this.texture.needsUpdate = true;

        },

        remove: function() {
            console.log('Removing offscreen-render component');
            this.offscreenRenderer.dispose();
            this.texture.dispose();
        }

    });
    </script>

    <script src="app.js"></script>

</body>
</html>
